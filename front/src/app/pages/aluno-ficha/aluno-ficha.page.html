<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/alunos-lista"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ nomeAluno || 'Ficha de Treino' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="block" [routerLink]="['/treino-cadastro', alunoId]" class="ion-margin-bottom">
    + Montar novo treino
  </ion-button>

  <ion-list *ngIf="treinos.length > 0; else semTreinos">
    <ion-card *ngFor="let treino of treinos">
      <ion-card-header>
        <ion-card-title>{{ treino.dia_semana }}</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-list *ngIf="treino.exercicios.length > 0; else semExercicios" lines="none">
          <ion-item *ngFor="let ex of treino.exercicios">
            <ion-label>
              <h3>{{ ex.exercicio_nome }}</h3>
              <p>Carga: {{ ex.carga }}kg • Repetições: {{ ex.repeticoes }}</p>
              <a *ngIf="ex.video_url" [href]="ex.video_url" target="_blank">Ver vídeo do exercício</a>
            </ion-label>
          </ion-item>
        </ion-list>

        <ng-template #semExercicios>
          <p>Nenhum exercício vinculado a esse treino ainda.</p>
        </ng-template>
      </ion-card-content>
    </ion-card>
  </ion-list>

  <ng-template #semTreinos>
    <div class="ion-text-center ion-padding">
      <p>Esse aluno ainda não tem nenhum treino montado.</p>
    </div>
  </ng-template>
</ion-content>
