<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Área do Aluno</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" color="light">
        <ion-icon name="log-out-outline" class="icone-sair"></ion-icon>
        Sair
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="welcome-banner">
    <h2>Olá, Aluno(a)!</h2>
    <p>Acompanhe seus treinos e sua situação financeira.</p>
  </div>

  <ion-card *ngIf="avisoPlano" [color]="avisoPlano.cor" routerLink="/aluno-financeiro" button>
    <ion-card-content>
      {{ avisoPlano.mensagem }}
    </ion-card-content>
  </ion-card>

  <ion-grid>
    <ion-row>
      <!-- Meus Treinos -->
      <ion-col size="12" size-md="6">
        <ion-card routerLink="/aluno-treinos" class="menu-card">
          <ion-card-content class="ion-text-center">
            <ion-icon name="barbell-outline" size="large" color="primary"></ion-icon>
            <ion-card-title>Meus Treinos</ion-card-title>
            <p>Visualizar suas fichas de treino atuais</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Planos e Pagamentos -->
      <ion-col size="12" size-md="6">
        <ion-card routerLink="/aluno-financeiro" class="menu-card">
          <ion-card-content class="ion-text-center">
            <ion-icon name="card-outline" size="large" color="success"></ion-icon>
            <ion-card-title>Planos e Pagamentos</ion-card-title>
            <p>Consultar status da mensalidade e plano ativo</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Meu Perfil -->
      <ion-col size="12" size-md="6">
        <ion-card routerLink="/aluno-perfil" class="menu-card">
          <ion-card-content class="ion-text-center">
            <ion-icon name="person-outline" size="large" color="warning"></ion-icon>
            <ion-card-title>Meu Perfil</ion-card-title>
            <p>Atualizar dados cadastrais e senha</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
