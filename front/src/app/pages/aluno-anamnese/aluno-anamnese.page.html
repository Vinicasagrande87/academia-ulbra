<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="'/aluno-ficha/' + alunoId"></ion-back-button>
    </ion-buttons>
    <ion-title>Anamnese{{ nomeAluno ? ' - ' + nomeAluno : '' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="carregando" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
  </div>

  <form *ngIf="!carregando" (ngSubmit)="salvar()">

    <ion-item>
      <ion-textarea
        label="Pratica alguma atividade desportiva atualmente?"
        labelPlacement="stacked"
        [(ngModel)]="anamnese.pratica_atividade_atualmente"
        name="pratica_atividade_atualmente"
        placeholder="Ex: Não / Sim, musculação"
        autoGrow="true"
        required>
      </ion-textarea>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Praticou alguma atividade física/desporto anteriormente?"
        labelPlacement="stacked"
        [(ngModel)]="anamnese.praticou_atividade_anteriormente"
        name="praticou_atividade_anteriormente"
        placeholder="Ex: Não / Sim, futebol até 2020"
        autoGrow="true"
        required>
      </ion-textarea>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Teve ou tem problemas osteoarticulares? (ex.: fraturas, lordoses, hérnias)"
        labelPlacement="stacked"
        [(ngModel)]="anamnese.problema_osteoarticular"
        name="problema_osteoarticular"
        placeholder="Ex: Não"
        autoGrow="true"
        required>
      </ion-textarea>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Teve ou tem problemas neuromusculares? (ex.: entorses, edemas, ruturas de ligamentos, micro/macro ruturas)"
        labelPlacement="stacked"
        [(ngModel)]="anamnese.problema_neuromuscular"
        name="problema_neuromuscular"
        placeholder="Ex: Não"
        autoGrow="true"
        required>
      </ion-textarea>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Sofre de problemas coronários? Risco familiar?"
        labelPlacement="stacked"
        [(ngModel)]="anamnese.problema_coronario"
        name="problema_coronario"
        placeholder="Ex: Não"
        autoGrow="true"
        required>
      </ion-textarea>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Sofre de problemas vasculares?"
        labelPlacement="stacked"
        [(ngModel)]="anamnese.problema_vascular"
        name="problema_vascular"
        placeholder="Ex: Não"
        autoGrow="true"
        required>
      </ion-textarea>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Foi hospitalizado nos últimos cinco anos?"
        labelPlacement="stacked"
        [(ngModel)]="anamnese.hospitalizado_5_anos"
        name="hospitalizado_5_anos"
        placeholder="Ex: Não"
        autoGrow="true"
        required>
      </ion-textarea>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Fez alguma cirurgia nos últimos cinco anos?"
        labelPlacement="stacked"
        [(ngModel)]="anamnese.cirurgia_5_anos"
        name="cirurgia_5_anos"
        placeholder="Ex: Não"
        autoGrow="true"
        required>
      </ion-textarea>
    </ion-item>

    <h2 class="ion-margin-top">Contato de Emergência</h2>

    <ion-item>
      <ion-input
        label="Nome"
        labelPlacement="stacked"
        [(ngModel)]="anamnese.contato_emergencia_nome"
        name="contato_emergencia_nome"
        placeholder="Ex: Maria Silva"
        required>
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-input
        label="Telefone"
        labelPlacement="stacked"
        [(ngModel)]="anamnese.contato_emergencia_telefone"
        name="contato_emergencia_telefone"
        placeholder="Ex: (51) 99999-9999"
        required>
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-input
        label="Grau de parentesco"
        labelPlacement="stacked"
        [(ngModel)]="anamnese.contato_emergencia_parentesco"
        name="contato_emergencia_parentesco"
        placeholder="Ex: Mãe, Pai, Cônjuge..."
        required>
      </ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="salvando || !podeSalvar()">
      {{ salvando ? 'Salvando...' : 'SALVAR ANAMNESE' }}
    </ion-button>
  </form>
</ion-content>
