<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home-aluno"></ion-back-button>
    </ion-buttons>
    <ion-title>Meus Treinos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="carregando" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
  </div>

  <div *ngIf="!carregando">
    <ion-list *ngIf="treinos.length > 0; else semTreinos">
      <ion-card *ngFor="let treino of treinos">
        <ion-card-header>
          <ion-card-title>{{ treino.dia_semana }}</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <ion-list lines="none">
            <ion-item *ngFor="let ex of treino.exercicios">
              <ion-label>
                <h3>{{ ex.exercicio_nome }}</h3>
                <p>Carga: {{ ex.carga }}kg • Repetições: {{ ex.repeticoes }}</p>

                <ion-button
                  *ngIf="ex.video_url"
                  fill="clear"
                  size="small"
                  (click)="toggleVideo(ex.exercicio_id)">
                  {{ videoEstaAberto(ex.exercicio_id) ? 'Ocultar vídeo' : 'Ver vídeo do exercício' }}
                </ion-button>

                <app-youtube-embed
                  *ngIf="ex.video_url && videoEstaAberto(ex.exercicio_id)"
                  [url]="ex.video_url">
                </app-youtube-embed>
              </ion-label>
            </ion-item>
          </ion-list>
        </ion-card-content>
      </ion-card>
    </ion-list>

    <ng-template #semTreinos>
      <div class="ion-text-center ion-padding">
        <p>Você ainda não tem nenhum treino montado. Fala com seu professor!</p>
      </div>
    </ng-template>
  </div>
</ion-content>
